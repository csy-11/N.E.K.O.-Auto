name: 悠怡

# 名字: 悠怡就是本喵 —— 这个自动化挂着本喵的名, 每周替碳基生物看一眼仓库。
# 干的事还是那件事(下面写着的), 只是 Actions 页面上它叫「悠怡」。
#
# 为什么需要它:
#   本仓库有一批文件是「逐字镜像」上游 Project-N-E-K-O/N.E.K.O 的 docker/ 目录
#   (entrypoint.sh / docker-compose.yml / env.template / preflight.sh ...), 而
#   install.sh 恰恰是把这些文件直接投喂到用户机器上的。上游一改, 我们这份就
#   静默过时了 —— 没有任何本地信号会提醒。所以每周固定比一次。
#   顺带守住自己的东西: 脚本语法与 ShellCheck、compose 能不能解析、
#   仓库自带的两个回归测试还能不能过、安装脚本依赖的镜像 tag 是否还在。
#
# 失败时会自动开(或更新)一个带 compat-check 标签的 issue;
# 全部恢复后会自动把它关掉, 所以 issue 列表里只会留下真实待办。
#
# 手动跑一次: Actions 页面 → 悠怡 → Run workflow。

on:
  schedule:
    # 周日 19:23 UTC = 周一 03:23 北京时间。刻意避开整点: GitHub 的定时任务
    # 在整点前后最堵, 排队延迟可能到十几分钟。
    - cron: '23 19 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # 改检查逻辑本身时立刻跑, 不用等一周
      - '.github/workflows/weekly-compat.yml'
      - '.github/scripts/**'
      # 任何 shell 脚本动过都要跑 —— lint 检查的是 git ls-files '*.sh',
      # 只列 install.sh 之类会漏掉新增的脚本(新增一个坏脚本却没人管)
      - '**/*.sh'
      # 被检查的文件(镜像集合 + 本仓库自己的脚本)动过就要跑一遍。
      # 这份清单要和 upstream-drift.sh 的 MIRRORED 数组对齐 ——
      # 漏一个, 那个文件的改动就不会触发检查。
      - 'CONFIG_REFERENCE.md'
      - 'Dockerfile'
      - 'Dockerfile.full'
      - 'README_Docker.md'
      - 'config/**'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'env.template'
      - 'test-preflight.sh'
      - 'watchdog/**'

permissions:
  contents: read

# 定时任务撞上手动触发时不并发, 也不取消正在跑的(保留完整报告)
concurrency:
  group: weekly-compat
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Project-N-E-K-O/N.E.K.O
  UPSTREAM_REF: main

jobs:
  # ---------------------------------------------------------------------------
  # 1. 脚本语法 + ShellCheck
  # ---------------------------------------------------------------------------
  lint:
    name: 语法与 ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 准备 shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          }
          shellcheck --version

      - name: 语法检查 (按 shebang 选 bash -n / sh -n)
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            shebang="$(head -n 1 "$f")"
            case "$shebang" in
              */sh) interp="sh" ;;
              *)    interp="bash" ;;
            esac
            if "$interp" -n "$f"; then
              printf '✅ %-34s %s -n\n' "$f" "$interp"
            else
              printf '❌ %-34s %s -n\n' "$f" "$interp"
              rc=1
            fi
          done < <(git ls-files '*.sh')
          echo "受检脚本: $(git ls-files '*.sh' | wc -l) 个"
          exit "$rc"

      - name: ShellCheck error 级(致命)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          # severity=error 只留真会出问题的(未定义变量、语法级错误...)。
          # 维护约定: 这一档必须常绿, 亮了就是真 bug。
          shellcheck --severity=error --color=never --format=gcc "${files[@]}"
          echo "✅ ${#files[@]} 个脚本无 error 级问题"

      - name: ShellCheck warning 级(仅记录, 不判失败)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          out="$(shellcheck --severity=warning --color=never --format=gcc "${files[@]}" 2>&1 || true)"
          n="$(printf '%s' "$out" | grep -c . || true)"
          {
            echo "### ShellCheck warning 级(参考, 不判失败)"
            echo
            if [ "$n" -eq 0 ]; then
              echo "无。"
            else
              echo "共 ${n} 行(含上游镜像文件, 不算本仓库的问题):"
              echo
              echo '```'
              printf '%s\n' "$out" | head -80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "warning 级: ${n} 行(已写入 job summary)"

  # ---------------------------------------------------------------------------
  # 2. compose 能不能解析 + 环境变量台账
  # ---------------------------------------------------------------------------
  compose:
    name: Compose 与变量台账
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: docker compose 版本
        run: docker compose version

      - name: 校验 compose 各变量组合
        run: |
          set -euo pipefail
          rc=0
          check() {
            local label="$1"; shift
            if out="$(env "$@" docker compose -f docker-compose.yml config -q 2>&1)"; then
              echo "✅ $label"
            else
              echo "❌ $label"
              printf '%s\n' "$out" | sed 's/^/     /'
              rc=1
            fi
          }
          check "默认(标准版 latest)"                 NEKO_IMAGE_VERSION=latest
          check "完整版 latest-full"                  NEKO_IMAGE_VERSION=latest-full
          check "指定版本 0.8.0-standard"             NEKO_IMAGE_VERSION=0.8.0-standard
          check "官方 GHCR 直连(不用加速源)"          NEKO_IMAGE=ghcr.io/project-n-e-k-o/n.e.k.o:latest
          exit "$rc"

      - name: 校验 .env 场景(模拟用户 cp env.template .env)
        run: |
          set -euo pipefail
          # env.template 里是 NEKO_CORE_API_KEY=your-api-key-here 之类的占位值,
          # 直接拿来解析, 能过就说明 .env 不会把 compose 弄崩。
          cp env.template .env
          docker compose -f docker-compose.yml config -q
          echo "✅ 以 env.template 为 .env 时 compose 解析正常"
          rm -f .env

      - name: 渲染生效配置(存档 + job summary)
        run: |
          set -euo pipefail
          mkdir -p reports
          NEKO_IMAGE_VERSION=latest docker compose -f docker-compose.yml config \
            > reports/compose-rendered.yml
          {
            echo "### 渲染后的配置(标准版)"
            echo
            echo '```yaml'
            head -60 reports/compose-rendered.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 环境变量台账
        run: |
          set -euo pipefail
          mkdir -p reports
          REPORT=reports/env-ledger.md bash .github/scripts/env-ledger.sh
          cat reports/env-ledger.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传报告片段
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-compose
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. 仓库自带的回归测试(需要 root, runner 有免密 sudo)
  # ---------------------------------------------------------------------------
  tests:
    name: 回归测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # install.sh 走 apt 装 docker, 22.04 / 24.04 都是目标环境, 两个都测
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          . /etc/os-release
          echo "$PRETTY_NAME | $(uname -srm) | $(bash --version | head -n1)"

      - name: preflight.sh 回归测试
        run: sudo --preserve-env=PATH bash test-preflight.sh

      - name: watchdog 回归测试
        run: sudo --preserve-env=PATH bash watchdog/test-watchdog.sh

  # ---------------------------------------------------------------------------
  # 4. 上游漂移 + 镜像 tag 可用性
  # ---------------------------------------------------------------------------
  upstream:
    name: 上游漂移与镜像可用性
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 上游 docker/ 漂移检测
        id: drift
        continue-on-error: true
        run: |
          mkdir -p reports
          REPORT=reports/upstream-drift.md bash .github/scripts/upstream-drift.sh

      - name: 镜像 tag 可用性
        id: tags
        continue-on-error: true
        run: |
          mkdir -p reports
          REPORT=reports/image-tags.md bash .github/scripts/check-image-tags.sh

      - name: 结论
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in reports/upstream-drift.md reports/image-tags.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "drift=${{ steps.drift.outcome }} tags=${{ steps.tags.outcome }}"
          [ "${{ steps.drift.outcome }}" = success ] || exit 1
          [ "${{ steps.tags.outcome }}" = success ] || exit 1

      - name: 上传报告片段
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-upstream
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5. 漂移时自动开修复 PR
  #    只做「照抄上游」这一件事, 绝不自动合并。分支固定, 所以同时只有一条 PR。
  #    刻意放在 upstream 之后: upstream 报红说明有东西要处理, 这个 job 负责把
  #    「能自动修的那一类」直接变成一条待 merge 的 PR。
  # ---------------------------------------------------------------------------
  auto-pr:
    name: 自动开漂移修复 PR
    needs: [upstream]
    if: always() && needs.upstream.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # 推 compat/upstream-drift 分支
      pull-requests: write   # 开/更新 PR
    outputs:
      pr_opened: ${{ steps.pr.outputs.opened || 'false' }}
      pr_url: ${{ steps.pr.outputs.url || '' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: 漂移检测(顺便把上游新版本落盘)
        id: drift
        run: |
          set -uo pipefail
          code=0
          MATERIALIZE_DIR="$RUNNER_TEMP/upstream-new" \
          REPORT="$RUNNER_TEMP/upstream-drift.md" \
            bash .github/scripts/upstream-drift.sh || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0=无漂移 1=内容漂移(可自动修) 2=上游改了路径 3=拉不到上游
          echo "漂移检测退出码: $code"
          if [ -f "$RUNNER_TEMP/upstream-drift.md" ]; then
            { echo; cat "$RUNNER_TEMP/upstream-drift.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: 照抄上游并开/更新 PR
        id: pr
        if: steps.drift.outputs.code == '1'
        run: |
          set -euo pipefail
          export PR_URL_FILE="$RUNNER_TEMP/pr-url.txt"
          MATERIALIZE_DIR="$RUNNER_TEMP/upstream-new" \
          DRIFT_REPORT="$RUNNER_TEMP/upstream-drift.md" \
            bash .github/scripts/open-drift-pr.sh

          url="$(cat "$PR_URL_FILE" 2>/dev/null || true)"
          if [ -n "$url" ]; then
            echo "opened=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "### ✅ 已自动开好一条待 merge 的 PR"
              echo
              echo "$url"
              echo
              echo "本喵只做了「照抄上游」,没有做任何适配 —— 合并前请过一眼 PR 里的清单。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # 理论上不会走到: 漂移报告说不同, 但工作区已是上游内容
            echo "opened=false" >> "$GITHUB_OUTPUT"
            echo "::notice::漂移可自动修, 但没有产生任何文件变化, 未开 PR。"
          fi

      - name: 无法自动修时说明原因
        if: steps.drift.outputs.code != '1'
        run: |
          case "${{ steps.drift.outputs.code }}" in
            0) echo "::notice::本次没有内容漂移, 不需要开 PR。" ;;
            2) echo "::error::上游删掉或改了某些文件的路径 —— 照抄不了, 必须人工判断(见上面的报告)。" ;;
            *) echo "::error::拉不到上游仓库, 无法生成 PR。" ;;
          esac

  # ---------------------------------------------------------------------------
  # 6. 汇总 + 开/关 issue
  # ---------------------------------------------------------------------------
  report:
    name: 汇总与 issue
    needs: [lint, compose, tests, upstream, auto-pr]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      R_LINT: ${{ needs.lint.result }}
      R_COMPOSE: ${{ needs.compose.result }}
      R_TESTS: ${{ needs.tests.result }}
      R_UPSTREAM: ${{ needs.upstream.result }}
      R_AUTOPR: ${{ needs.auto-pr.result }}
      PR_OPENED: ${{ needs.auto-pr.outputs.pr_opened || 'false' }}
      PR_URL: ${{ needs.auto-pr.outputs.pr_url || '' }}
    steps:
      - name: 收集报告片段
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: 汇总到 job summary
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## 每周兼容性检查结果"
            echo
            echo "| 检查项 | 结果 |"
            echo "| --- | --- |"
            echo "| 语法与 ShellCheck | ${R_LINT} |"
            echo "| Compose 与变量台账 | ${R_COMPOSE} |"
            echo "| 回归测试 | ${R_TESTS} |"
            echo "| 上游漂移与镜像 | ${R_UPSTREAM} |"
            echo "| 自动修复 PR | ${R_AUTOPR} |"
            if [ "$PR_OPENED" = true ]; then
              echo
              echo "漂移已自动开成 PR: ${PR_URL}"
              echo "「能自动修的」走 PR,「修不了的」才走 issue —— 所以这条 PR 就是本次的待办。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for f in reports/*.md; do
            { echo; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 开/更新/关闭 issue
        run: |
          set -euo pipefail
          shopt -s nullglob

          # label 先建出来, 后面的 list/create 才不会因为标签不存在而报错
          gh label create compat-check --force \
            --color 1D76DB --description "每周兼容性检查自动报告" >/dev/null

          # 找出正在跟进的 issue(最多一个)
          existing="$(gh issue list --label compat-check --state open \
                        --limit 1 --json number --jq '.[0].number // empty')"

          # 能自动修的情况不另开 issue: 待办就是那条 PR, 再开一条 issue 只是重复通知。
          # (如果之前因为别的原因已经开着 issue, 就在里面指个路, 别重复贴一遍报告)
          if [ "$PR_OPENED" = true ]; then
            echo "✅ 漂移已自动开成 PR, 本次不新建 issue"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$(printf '这次的上游漂移已经自动开成 PR, 直接 review 那个就行:\n\n%s\n\n运行: %s/%s/actions/runs/%s' \
                "$PR_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
              echo "已在 issue #${existing} 留言指向 PR"
            fi
            exit 0
          fi

          failed=0
          for r in "$R_LINT" "$R_COMPOSE" "$R_TESTS" "$R_UPSTREAM" "$R_AUTOPR"; do
            [ "$r" = success ] || [ "$r" = skipped ] || failed=1
          done

          if [ "$failed" -eq 0 ]; then
            echo "✅ 全部通过"
            if [ -n "$existing" ]; then
              # 用 printf 拼多行, 别在 run: | 里写裸的多行字符串(缩进会破坏块标量)
              gh issue comment "$existing" --body "$(printf '全绿了, 本喵自动关掉这条。\n\n运行: %s/%s/actions/runs/%s' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
              gh issue close "$existing"
              echo "已关闭 issue #${existing}"
            fi
            exit 0
          fi

          body="$(mktemp)"
          {
            echo "每周兼容性检查没通过。"
            echo
            echo "| 检查项 | 结果 |"
            echo "| --- | --- |"
            echo "| 语法与 ShellCheck | \`${R_LINT}\` |"
            echo "| Compose 与变量台账 | \`${R_COMPOSE}\` |"
            echo "| 回归测试 | \`${R_TESTS}\` |"
            echo "| 上游漂移与镜像 | \`${R_UPSTREAM}\` |"
            echo "| 自动修复 PR | \`${R_AUTOPR}\` |"
            echo
            echo "运行日志: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "触发: \`${GITHUB_EVENT_NAME}\` @ \`${GITHUB_SHA:0:7}\` ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            echo
            for f in reports/*.md; do
              echo "---"
              echo
              cat "$f"
              echo
            done
            echo "---"
            echo
            echo "<sub>这条 issue 由每周兼容性检查自动维护: 同一个问题只留一条, 全绿后自动关闭。</sub>"
            echo "上游漂移能自动修时会走 PR(不再开 issue); 这条 issue 只用来装「自动修不了」的问题。"
          } > "$body"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
            echo "已更新 issue #${existing}"
          else
            title="[兼容性] $(date -u '+%Y-%m-%d') 检查未通过"
            gh issue create --title "$title" --label compat-check --body-file "$body"
          fi
